<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de Transacciones SAP (MM, FI, PP-PI)</title>
    <style>
        :root {
            --sap-blue: #0a6ed1;
            --sap-dark-blue: #032d60;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 25px 20px;
            background-color: var(--sap-dark-blue);
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        header p {
            color: #d1e3f8;
            font-size: 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 2;
            min-width: 250px;
        }

        .filter-box {
            flex: 1;
            min-width: 200px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--sap-blue);
        }

        .stats {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: var(--sap-dark-blue);
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f7fe;
        }

        .tcode {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: var(--sap-blue);
            background-color: #eef5fc;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .module-compras { background-color: #e3f2fd; color: #0d47a1; }
        .module-inventarios { background-color: #e8f5e9; color: #1b5e20; }
        .module-maestros { background-color: #fff3e0; color: #e65100; }
        .module-facturacion { background-color: #f3e5f5; color: #4a148c; }
        .module-reportes { background-color: #e0f2f1; color: #004d40; }
        .module-fi { background-color: #ffebee; color: #b71c1c; }
        .module-produccion { background-color: #fbe9e7; color: #d84315; }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Manual de Transacciones SAP (Día a Día)</h1>
            <p>Buscador de códigos T-Code para Compras, Inventarios, Finanzas y Producción PP-PI</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por T-Code o descripción (ej. COR1, PI Sheet, ME21N, FB60)...">
            </div>
            <div class="filter-box">
                <select id="categoryFilter">
                    <option value="ALL">Todas las Categorías</option>
                    <option value="Compras">Compras (MM-PUR)</option>
                    <option value="Inventarios">Movimiento de mercancías (MM-IM)</option>
                    <option value="Maestros">Maestro Materiales / Proveedores</option>
                    <option value="Facturación">Verificación de facturas (MM-IV)</option>
                    <option value="Finanzas">Finanzas y Pagos (FI)</option>
                    <option value="Producción">Producción de Procesos (PP-PI)</option>
                    <option value="Reportes">Informes y análisis</option>
                </select>
            </div>
        </div>

        <div class="stats" id="statsCount">Cargando transacciones...</div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Transacción (T-Code)</th>
                        <th>Categoría / Área</th>
                        <th>Descripción / Función</th>
                    </tr>
                </thead>
                <tbody id="tcodeTableBody">
                    <!-- Filas cargadas dinámicamente -->
                </tbody>
            </table>
            <div id="noResults" class="no-results" style="display: none;">
                No se encontraron transacciones que coincidan con la búsqueda.
            </div>
        </div>
    </div>

    <script>
        const sapData = [
            // 1. Compras (MM-PUR)
            { tcode: "ME21N", category: "Compras", moduleClass: "compras", desc: "Crear pedido de compra" },
            { tcode: "ME22N", category: "Compras", moduleClass: "compras", desc: "Modificar pedido de compra" },
            { tcode: "ME23N", category: "Compras", moduleClass: "compras", desc: "Visualizar pedido de compra" },
            { tcode: "ME51N", category: "Compras", moduleClass: "compras", desc: "Crear solicitud de pedido (SolPed)" },
            { tcode: "ME52N", category: "Compras", moduleClass: "compras", desc: "Modificar solicitud de pedido" },
            { tcode: "ME53N", category: "Compras", moduleClass: "compras", desc: "Visualizar solicitud de pedido" },
            { tcode: "ME31K", category: "Compras", moduleClass: "compras", desc: "Crear contrato marco" },
            { tcode: "ME32K", category: "Compras", moduleClass: "compras", desc: "Modificar contrato marco" },
            { tcode: "ME33K", category: "Compras", moduleClass: "compras", desc: "Visualizar contrato marco" },
            { tcode: "ME41",  category: "Compras", moduleClass: "compras", desc: "Crear solicitud de presupuesto / cotización (RFQ)" },
            { tcode: "ME42",  category: "Compras", moduleClass: "compras", desc: "Cambiar solicitud de cotización" },
            { tcode: "ME43",  category: "Compras", moduleClass: "compras", desc: "Mostrar solicitud de presupuesto" },
            { tcode: "ME47",  category: "Compras", moduleClass: "compras", desc: "Mantenimiento / Evaluación de cotizaciones" },
            { tcode: "ME11",  category: "Compras", moduleClass: "compras", desc: "Crear registro info de compras" },
            { tcode: "ME12",  category: "Compras", moduleClass: "compras", desc: "Modificar registro info de compras" },
            { tcode: "ME13",  category: "Compras", moduleClass: "compras", desc: "Visualizar registro info de compras" },
            { tcode: "ME81N", category: "Compras", moduleClass: "compras", desc: "Análisis de valor de pedidos (Informes)" },

            // 2. Movimiento de mercancías e Inventarios (MM-IM)
            { tcode: "MIGO", category: "Inventarios", moduleClass: "inventarios", desc: "Movimiento de mercancías (Entradas, salidas, traspasos)" },
            { tcode: "MB1A", category: "Inventarios", moduleClass: "inventarios", desc: "Salida de mercancías (Legacy)" },
            { tcode: "MB1B", category: "Inventarios", moduleClass: "inventarios", desc: "Contabilización de traspaso / transferencia (Legacy)" },
            { tcode: "MB1C", category: "Inventarios", moduleClass: "inventarios", desc: "Otras entradas de mercancías (Legacy)" },
            { tcode: "MBS1", category: "Inventarios", moduleClass: "inventarios", desc: "Entrada de mercancías para entrega (Basada en pedido)" },
            { tcode: "MBRL", category: "Inventarios", moduleClass: "inventarios", desc: "Devolución de entrega para pedido de compra" },
            { tcode: "MBST", category: "Inventarios", moduleClass: "inventarios", desc: "Anular documento de movimiento de mercancías" },
            { tcode: "MI01", category: "Inventarios", moduleClass: "inventarios", desc: "Crear documento de inventario físico" },
            { tcode: "MI02", category: "Inventarios", moduleClass: "inventarios", desc: "Modificar documento de inventario físico" },
            { tcode: "MI03", category: "Inventarios", moduleClass: "inventarios", desc: "Visualizar documento de inventario físico" },
            { tcode: "MI04", category: "Inventarios", moduleClass: "inventarios", desc: "Introducir recuento de inventario" },
            { tcode: "MI05", category: "Inventarios", moduleClass: "inventarios", desc: "Modificar recuento de inventario" },

            // 3. Maestros de Materiales, Proveedores y Clientes
            { tcode: "MM01", category: "Maestros", moduleClass: "maestros", desc: "Crear datos maestros de materiales" },
            { tcode: "MM02", category: "Maestros", moduleClass: "maestros", desc: "Modificar datos maestros de materiales" },
            { tcode: "MM03", category: "Maestros", moduleClass: "maestros", desc: "Visualizar datos maestros de materiales" },
            { tcode: "MMSC", category: "Maestros", moduleClass: "maestros", desc: "Entrada colectiva de almacenes para material" },
            { tcode: "MR21", category: "Maestros", moduleClass: "maestros", desc: "Modificación del precio del material (SKU)" },
            { tcode: "XK01", category: "Maestros", moduleClass: "maestros", desc: "Crear registro maestro de proveedor (Central)" },
            { tcode: "XK02", category: "Maestros", moduleClass: "maestros", desc: "Modificar registro maestro de proveedor (Central)" },
            { tcode: "XK03", category: "Maestros", moduleClass: "maestros", desc: "Visualizar registro maestro de proveedor (Central)" },
            { tcode: "MK01", category: "Maestros", moduleClass: "maestros", desc: "Crear registro maestro de proveedor (Compras)" },
            { tcode: "MK02", category: "Maestros", moduleClass: "maestros", desc: "Modificar registro maestro de proveedor (Compras)" },
            { tcode: "MK03", category: "Maestros", moduleClass: "maestros", desc: "Visualizar registro maestro de proveedor (Compras)" },
            { tcode: "FK03", category: "Maestros", moduleClass: "maestros", desc: "Consultar datos contables de proveedor" },
            { tcode: "FD03", category: "Maestros", moduleClass: "maestros", desc: "Consultar datos contables de cliente" },

            // 4. Verificación de facturas (MM-IV)
            { tcode: "MIRO", category: "Facturación", moduleClass: "facturacion", desc: "Ingresar factura entrante (Verificar y contabilizar)" },
            { tcode: "MIR7", category: "Facturación", moduleClass: "facturacion", desc: "Estacionar / Preliminar factura entrante" },
            { tcode: "MRBR", category: "Facturación", moduleClass: "facturacion", desc: "Liberar facturas bloqueadas para el pago" },
            { tcode: "MR8M", category: "Facturación", moduleClass: "facturacion", desc: "Cancelar / Anular documento de factura" },

            // 5. Finanzas y Pagos (FI)
            { tcode: "FB50", category: "Finanzas", moduleClass: "fi", desc: "Registrar asiento contable (Cuentas de Mayor)" },
            { tcode: "FB60", category: "Finanzas", moduleClass: "fi", desc: "Registrar factura de proveedor (Directa sin pedido MM)" },
            { tcode: "FB70", category: "Finanzas", moduleClass: "fi", desc: "Registrar factura de cliente (Contabilidad)" },
            { tcode: "FB03", category: "Finanzas", moduleClass: "fi", desc: "Consultar / Visualizar documento contable" },
            { tcode: "FB08", category: "Finanzas", moduleClass: "fi", desc: "Anular documento contable" },
            { tcode: "FBL1N", category: "Finanzas", moduleClass: "fi", desc: "Ver partidas individuales de proveedores" },
            { tcode: "FBL5N", category: "Finanzas", moduleClass: "fi", desc: "Ver partidas individuales de clientes" },
            { tcode: "FBL3N", category: "Finanzas", moduleClass: "fi", desc: "Ver partidas individuales de cuentas de mayor" },
            { tcode: "FS00", category: "Finanzas", moduleClass: "fi", desc: "Crear, modificar y consultar cuentas de mayor" },
            { tcode: "F-53", category: "Finanzas", moduleClass: "fi", desc: "Registrar pago manual a proveedor" },
            { tcode: "F-28", category: "Finanzas", moduleClass: "fi", desc: "Registrar cobro manual de cliente" },
            { tcode: "F110", category: "Finanzas", moduleClass: "fi", desc: "Programa y ejecución automática de pagos" },
            { tcode: "F.13", category: "Finanzas", moduleClass: "fi", desc: "Compensación automática de partidas abiertas" },

            // 6. Producción de Procesos (PP-PI)
            { tcode: "COR1", category: "Producción", moduleClass: "produccion", desc: "Crear orden de proceso" },
            { tcode: "COR2", category: "Producción", moduleClass: "produccion", desc: "Modificar orden de proceso" },
            { tcode: "COR3", category: "Producción", moduleClass: "produccion", desc: "Visualizar orden de proceso" },
            { tcode: "COR5", category: "Producción", moduleClass: "produccion", desc: "Liberación colectiva de órdenes de proceso" },
            { tcode: "COR6", category: "Producción", moduleClass: "produccion", desc: "Notificar eventos/tiempos de orden de proceso" },
            { tcode: "CO60", category: "Producción", moduleClass: "produccion", desc: "Buscar e ingresar a hojas de instrucción de proceso (PI Sheet)" },
            { tcode: "COID", category: "Producción", moduleClass: "produccion", desc: "Sistema de información / Listas de detalle en PP-PI" },

            // 7. Informes y análisis
            { tcode: "MMBE", category: "Reportes", moduleClass: "reportes", desc: "Resumen de existencias por centro, almacén y lote" },
            { tcode: "MB52", category: "Reportes", moduleClass: "reportes", desc: "Listado de existencias de almacén valoradas" },
            { tcode: "MB5B", category: "Reportes", moduleClass: "reportes", desc: "Stock por fecha de contabilización" },
            { tcode: "MB5T", category: "Reportes", moduleClass: "reportes", desc: "Stock en tránsito por centro receptor" },
            { tcode: "MB51", category: "Reportes", moduleClass: "reportes", desc: "Lista de documentos de material (Historial de movimientos)" },
            { tcode: "ME2N", category: "Reportes", moduleClass: "reportes", desc: "Análisis de pedidos por número de pedido" },
            { tcode: "ME2L", category: "Reportes", moduleClass: "reportes", desc: "Análisis de pedidos por proveedor" },
            { tcode: "ME2M", category: "Reportes", moduleClass: "reportes", desc: "Análisis de pedidos por material" }
        ];

        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const tcodeTableBody = document.getElementById('tcodeTableBody');
        const statsCount = document.getElementById('statsCount');
        const noResults = document.getElementById('noResults');

        function renderTable(data) {
            tcodeTableBody.innerHTML = '';

            if (data.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                data.forEach(item => {
                    const row = document.createElement('tr');
                    
                    row.innerHTML = `
                        <td><span class="tcode">${item.tcode}</span></td>
                        <td><span class="badge module-${item.moduleClass}">${item.category}</span></td>
                        <td>${item.desc}</td>
                    `;
                    
                    tcodeTableBody.appendChild(row);
                });
            }

            statsCount.textContent = `Mostrando ${data.length} transacción(es)`;
        }

        function filterData() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const selectedCategory = categoryFilter.value;

            const filtered = sapData.filter(item => {
                const matchesSearch = item.tcode.toLowerCase().includes(searchTerm) || 
                                      item.desc.toLowerCase().includes(searchTerm) ||
                                      item.category.toLowerCase().includes(searchTerm);
                
                const matchesCategory = selectedCategory === 'ALL' || item.category === selectedCategory;

                return matchesSearch && matchesCategory;
            });

            renderTable(filtered);
        }

        searchInput.addEventListener('input', filterData);
        categoryFilter.addEventListener('change', filterData);

        // Carga inicial
        renderTable(sapData);
    </script>
</body>
</html>
